org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# App configuration (never commit real keys)
# ---------------------------------------------------------------------------
# AMap Android key. Keep it empty to use the built-in schematic map + fake
# location provider. You can also put AMAP_KEY in android/local.properties.
AMAP_KEY=

# Server root URL. The app appends /api for REST calls and connects to /ws.
# 10.0.2.2 is the Android emulator alias for the host machine.
# You can also put API_BASE_URL in android/local.properties (takes priority).
API_BASE_URL=http://10.0.2.2:3000
